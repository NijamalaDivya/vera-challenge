services:
  - type: web
    name: vera-challenge-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /v1/healthz
    envVars:
      - key: TEAM_NAME
        sync: false
      - key: TEAM_MEMBERS
        sync: false
      - key: BOT_MODEL
        value: deterministic-router-v1
      - key: BOT_VERSION
        value: 1.1.0
      - key: CONTACT_EMAIL
        sync: false
      - key: SUBMITTED_AT
        sync: false
